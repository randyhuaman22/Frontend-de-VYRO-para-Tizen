<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>VYRO</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- LOGIN -->
  <div id="loginLayer" class="login-layer" role="dialog">
    <div class="login-container">
      <div class="login-card">
        <img class="login-logo" src="assets/add-the-wordmark--vyro--in-solid-white--bold-moder.png" alt="VYRO" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'></svg>'">
        <p class="eyebrow">TU ENTRETENIMIENTO, A TU MANERA</p>
        <h1>Bienvenido</h1>
        <form id="loginForm" autocomplete="off">
          <label for="username">Usuario</label>
          <input id="username" type="text" placeholder="Ingresa tu usuario" tabindex="0" readonly>
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Ingresa tu contraseña" tabindex="0" readonly>
          <button id="btnLogin" class="primary-button" type="submit" tabindex="0">Entrar <span aria-hidden="true">›</span></button>
        </form>
        <p id="loginMessage" class="message"></p>
      </div>
      <!-- TECLADO DEL LOGIN -->
      <div id="loginKeyboard" class="login-keyboard is-hidden"></div>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="appShell" class="app-shell is-hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><span class="brand-word">VYRO</span></div>
      <nav id="mainNav">
        <button class="nav-item is-active" data-view="movies" tabindex="0"><span class="nav-icon">▣</span><span class="nav-label">Películas</span></button>
        <button class="nav-item" data-view="tv" tabindex="0"><span class="nav-icon">📺</span><span class="nav-label">TV en Vivo</span></button>
        <button class="nav-item" data-view="matches" tabindex="0"><span class="nav-icon">◉</span><span class="nav-label">Deportes</span></button>
      </nav>
      <div class="sidebar-footer"><span class="online-dot"></span><span class="nav-label">VYRO TV</span></div>
    </aside>

    <main id="mainContent" class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow" id="pageEyebrow">EXPLORA VYRO</p>
          <h1 id="pageTitle">Películas</h1>
        </div>
        <button id="btnOpenSearch" class="search-trigger" tabindex="0">
          <span class="search-icon">⌕</span> Buscar
        </button>
      </header>

      <div id="statusMessage" class="status-message"></div>
      <section class="catalog-section">
        <div id="contentGrid" class="content-grid"></div>
      </section>
    </main>
  </div>

  <!-- VENTANA MODAL DE BÚSQUEDA -->
  <div id="searchModal" class="search-modal is-hidden">
    <div class="search-modal-content">
      <h2>Buscar contenido</h2>
      <input id="moduleSearchInput" type="text" placeholder="Escribe para buscar..." readonly>
      <div id="virtualKeyboard" class="virtual-keyboard"></div>
      <button id="btnCloseSearch" class="primary-button close-search" tabindex="0">Cerrar Búsqueda</button>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <section id="playerLayer" class="player-layer is-hidden">
    <video id="videoPlayer" class="video-player" controls autoplay playsinline></video>
    <div id="iframeHost" class="iframe-host is-hidden"></div>
    <button id="btnVolver" class="back-button-transparent" tabindex="0" title="Volver">‹</button>
    <div id="playerStatus" class="player-status"></div>
  </section>
</body>
</html>
